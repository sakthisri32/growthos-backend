services:
  - type: web
    name: growthos-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false            # set in Render dashboard → connect Supabase URL
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure value
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL
        sync: false            # set to your Vercel URL, e.g. https://growthos.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false            # paste your Anthropic key in Render dashboard
